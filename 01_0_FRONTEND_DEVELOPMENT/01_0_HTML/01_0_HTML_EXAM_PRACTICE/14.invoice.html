<!DOCTYPE html>
<html>
<head>
    <title>Invoice Table</title>
</head>

<body>

    <table border="1">

        <tr>
            <th colspan="4">Computer Shop Invoice</th>
        </tr>

        <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Total</th>
        </tr>

        <tr>
            <td>Keyboard</td>
            <td>2</td>
            <td>800</td>
            <td>1600</td>
        </tr>

        <tr>
            <td>Mouse</td>
            <td>3</td>
            <td>500</td>
            <td>1500</td>
        </tr>

        <tr>
            <td>Monitor</td>
            <td>1</td>
            <td>12000</td>
            <td>12000</td>
        </tr>

        <tr>
            <th colspan="3">Grand Total</th>
            <th>15100</th>
        </tr>

    </table>

</body>
</html>
