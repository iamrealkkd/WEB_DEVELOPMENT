<!doctype html>
<html>
  <head>
    <title>Row Span</title>
  </head>
  <body>
    <h1>Marks</h1>
    <table border="1">
      <tr>
        <td>Name</td>
        <td>Subject</td>
        <td>Marks</td>
      </tr>
      <tr>
        <td rowspan="3">Krishna</td>
        <td>HTML</td>
        <td>80</td>
      </tr>
      <tr>
        <td>CSS</td>
        <td>85</td>
      </tr>
      <tr>
        <td>Javascrpt</td>
        <td>90</td>
      </tr>
    </table>
  </body>
</html>
