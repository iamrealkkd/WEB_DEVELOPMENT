    <h1>HTML Character Entities</h1>

    <p>5 &lt; 10</p>

    <p>10 &gt; 5</p>

    <p>HTML &amp; CSS</p>

    <p>&quot;JavaScript&quot;</p>

    <p>&copy; 2026 Krishna</p>

    <p>HTML&nbsp;CSS</p>
</body>

<!-- CHARACTER ENTITY

Character entity special characters ko webpage par literally
display karne ke liye use hoti hai.

Character entity:
- & symbol se start hoti hai.
- ; semicolon par end hoti hai.

Example:

HTML code:
5 &lt; 10

Browser output:
5 < 10


IMPORTANT ENTITIES:

&lt;
Output: <
Meaning: Less than

&gt;
Output: >
Meaning: Greater than

&amp;
Output: &
Meaning: Ampersand

&quot;
Output: "
Meaning: Double quotation mark

&copy;
Output: ©
Meaning: Copyright symbol

&nbsp;
Output: One extra non-breaking space


WHY CHARACTER ENTITIES ARE USED?

HTML mein <, >, &, quotes jaise kuch characters ka special
meaning hota hai.

In characters ko normal text ke form mein display karne ke liye
character entities use ki jaati hain.


EXAMPLES:

HTML code:
<p>5 &lt; 10</p>

Browser output:
5 < 10


HTML code:
<p>10 &gt; 5</p>

Browser output:
10 > 5


HTML code:
<p>HTML &amp; CSS</p>

Browser output:
HTML & CSS


HTML code:
<p>&quot;JavaScript&quot;</p>

Browser output:
"JavaScript"


HTML code:
<p>&copy; 2026 Krishna</p>

Browser output:
© 2026 Krishna


HTML code:
<p>HTML&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;CSS</p>

Browser output:
HTML     CSS


IMPORTANT:

HTML normally multiple ordinary spaces ko ek hi space mein
convert kar deta hai.

Isliye extra fixed spaces dikhane ke liye multiple &nbsp;
entities use ki jaati hain.


ONE-LINE EXAM DEFINITION:

Character entities are special codes used to display reserved
or special characters in an HTML document. -->
