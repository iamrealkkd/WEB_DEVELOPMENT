<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="This is a student portfolio website.">
        <meta name="keywords" content="HTML, CSS, JavaScript, Portfolio">
        <meta name="author" content="Krishna">
        <title>Krishna</title>
    </head>
    <body>
        <h1>
            Welcome to My Portfolio
        </h1>
        <p>
            I am a B.Tech Computer Science student learning web development.
        </p>

    </body>
</html>
<!-- META TAG, HEAD SECTION AND BODY SECTION

1. META TAG

Definition:
The <meta> tag provides metadata or additional information about an HTML document.

Hinglish:
Meta tag webpage ke baare mein extra information deta hai.

Metadata ka meaning:
Data about data, yani webpage ke baare mein information.

Important Points:
- Meta tags <head> section ke andar likhe jaate hain.
- Meta tags ka content webpage par directly visible nahi hota.
- Browsers, search engines aur devices meta information ka use karte hain.
- <meta> ek empty/void tag hai.
- Iska closing tag nahi hota.

Syntax:

<meta name="property-name" content="property-value">


CHARSET META TAG

<meta charset="UTF-8">

Purpose:
Webpage ki character encoding define karta hai.

UTF-8:
English, Hindi, numbers, symbols aur most international characters ko properly display karta hai.


VIEWPORT META TAG

<meta name="viewport" content="width=device-width, initial-scale=1.0">

Purpose:
Webpage ko mobile aur different screen sizes par properly display karne mein help karta hai.

width=device-width:
Webpage ki width ko device ki screen width ke equal set karta hai.

initial-scale=1.0:
Webpage ko normal zoom level par open karta hai.


DESCRIPTION META TAG

<meta name="description" content="This is a student portfolio website.">

Purpose:
Webpage ka short description provide karta hai.

Search engines is description ko search results mein use kar sakte hain.


KEYWORDS META TAG

<meta name="keywords" content="HTML, CSS, JavaScript, Portfolio">

Purpose:
Webpage se related important keywords batata hai.


AUTHOR META TAG

<meta name="author" content="Krishna">

Purpose:
Webpage ke creator ya author ka naam batata hai.


2. HEAD SECTION

Definition:
The <head> section contains metadata and information about the webpage.

Hinglish:
Head section mein webpage ke baare mein information hoti hai.

Important Points:
- <head> ka content generally webpage par directly visible nahi hota.
- Browser aur search engines head section ki information ka use karte hain.
- <head> tag <html> ke andar aur <body> se pehle likha jaata hai.

Common elements inside <head>:

- <meta> tags
- <title>
- CSS file links
- JavaScript file links
- SEO-related information

Example:

<head>
    <meta charset="UTF-8">
    <title>Student Portfolio</title>
</head>


TITLE TAG

<title>Student Portfolio</title>

Purpose:
Browser ke tab mein webpage ka title display karta hai.

Important:
<title> body ke visible webpage area mein display nahi hota.


3. BODY SECTION

Definition:
The <body> section contains all the visible content of a webpage.

Hinglish:
Body section mein webpage ka woh content hota hai jo user browser screen par dekhta hai.

Common elements inside <body>:

- Headings
- Paragraphs
- Images
- Hyperlinks
- Lists
- Tables
- Forms
- Buttons
- Div sections

Example:

<body>
    <h1>Welcome to My Portfolio</h1>

    <p>
        I am a B.Tech Computer Science student learning web development.
    </p>
</body>


HEAD VS BODY

HEAD:
- Webpage ke baare mein information rakhta hai.
- Content generally webpage par visible nahi hota.
- Meta tags, title, CSS links aur JavaScript links rakhta hai.
- Browser aur search engines ke liye important hota hai.

BODY:
- Webpage ka visible content rakhta hai.
- User ko browser screen par dikhai deta hai.
- Headings, paragraphs, images, links, tables aur forms rakhta hai.


SIMPLE DIFFERENCE:

<head> = Page ke baare mein information

<body> = Page ke andar dikhne wala content


ONE-LINE EXAM DEFINITIONS

Meta Tag:
The meta tag provides metadata about an HTML document and is placed inside the head section.

Head Section:
The head section contains metadata, title and links to external resources and is generally not directly visible on the webpage.

Body Section:
The body section contains all the visible content displayed to the user in the browser. -->
