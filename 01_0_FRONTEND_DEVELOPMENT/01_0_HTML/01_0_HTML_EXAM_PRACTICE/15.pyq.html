<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>

    <style>
        th, td {
            padding: 8px 14px;
            text-align: center;
        }
    </style>
</head>

<body>

<table border="1">

    <caption>Student Marks</caption>

    <thead>
        <tr>
            <th colspan="3">Student Result</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
    </thead>

    <tbody>

        <tr>
            <td rowspan="2">Krishna</td>
            <td>HTML</td>
            <td>85</td>
        </tr>

        <tr>
            <td>CSS</td>
            <td>90</td>
        </tr>

    </tbody>

    <tfoot>
        <tr>
            <th colspan="2">Total</th>
            <th>175</th>
        </tr>
    </tfoot>

</table>

</body>
</html>
